# ─────────────────────────────────────────────────────────────────────────────
# CV data — the single source for cv.qmd, which renders it to both the web
# page (cv.html) and the PDF (cv.pdf). Publications come from references.bib.
#
# Each section is a list of entries, shown in the order written here.
# Entry fields (all optional, all accept Markdown):
